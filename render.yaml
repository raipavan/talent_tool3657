databases:
  - name: talentpool365-cms-db
    databaseName: talentpool365
    user: talentpool_admin
    plan: free

services:
  - type: web
    name: talent-tool3657
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talentpool365-cms-db
          property: connectionString
      - key: CMS_JWT_SECRET
        generateValue: true
      - key: CMS_ADMIN_USER
        sync: false
      - key: CMS_ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://talent-tool3657.onrender.com
